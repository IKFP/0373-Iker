<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Inscripción</title>

<body>
    <header>
        <h1>Formulario de Inscripción al Torneo</h1>
    </header>
    <main>

        <form method="get" action="">
            <label for="inputNombre">Nombre Completo:</label>
            <input required type="text" name="nombre" id="InputNombre" placeholder="Tu nombre completo">

            <label for="inputGmail">Correo Electrónico:</label>
            <input type="email" name="gmail" id="InputGmail" placeholder="tu.correo@ejemplo.com">

            <label for="inputEdad">Edad:</label>
            <input type="number" name="edad" id="InputEdad" placeholder="Tu edad">

            <label for="inputNickname">Nickname:</label>
            <input type="text" name="nickname" id="InputNickname" placeholder="Tu nickname">

            <label for="Contraseña">Contraseña:</label>
            <input type="password" name="contra" id="contra" placeholder="Tu contraseña">

            <fieldset>
                <legend>Videojuego del Torneo</legend>
                <label for="inputJuego">Videojuegos a participar:</label>
                <select name="juego" id="InputJuego">
                    <option value="Valorant">Valorant</option>
                    <option value="Fortnite">Fortnite</option>
                    <option value="CSGO">CSGO</option>
                    <option value="MarvelRivals">Marvel Rivals</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Plataforma</legend>
                <label for="Plat">PC:</label>
                <input type="radio" name="plataforma" id="InputPlat" value="PC">
                <label for="Plat">Xbox:</label>
                <input type="radio" name="plataforma" id="InputPlat" value="xbox">
                <label for="Plat">PlayStation:</label>
                <input type="radio" name="plataforma" id="InputPlat" value="playstation">
            </fieldset>

            <fieldset> 
                <legend>Disponibilidad</legend>
                <label for="dispo">Mañana</label>
                <input type="checkbox" id="dispo">
                <label for="dispo">Tarde</label>
                <input type="checkbox" id="dispo">
                <label for="dispo">Noche</label>
                <input type="checkbox" id="dispo">
            </fieldset>

            <fieldset>
                <legend>Fecha de Nacimiento</legend>
                <label for="inputFecha">Fecha de Nacimiento:</label>
                <input type="date" name="fecha" id="InputFecha">
            </fieldset>

            <fieldset>
                <legend>Comentarios Adicionales</legend>
                <textarea name="name" id="textarea" cols="70" rows="10" placeholder="Escribe aquí..."></textarea>
            </fieldset>
            
            <fieldset>
                <legend>Archivo</legend>
                <label for="link">Términos y condiciones:</label>
                <a href="term.html" target="_blank">Click aquí</a>
                <label for="termi">Acepto los términos y condiciones</label>
                <input requires type="radio" name="term" id="termi">
            </fieldset>
